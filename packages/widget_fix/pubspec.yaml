name: widget_fix
description: >-
  Long press any widget of your Flutter app in a debug build, type what is wrong, and the report
  lands in the Claude Code session running in your project. Release builds compile it away.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
